name: Preview release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  ASTRO_TELEMETRY_DISABLED: true

jobs:
  preview:
    if: ${{ github.repository_owner == 'LightNetDev'}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    name: Publish preview release
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Publish packages
        run: |
          pnpm dlx pkg-pr-new publish --pnpm --no-template --no-compact 'packages/lightnet' 'packages/sveltia-admin'
