name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: ${{ github.repository_owner == 'LightNetDev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Create release PR
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm changeset publish
          commit-message: "[ci] release"
          pr-title: "[ci] release"
